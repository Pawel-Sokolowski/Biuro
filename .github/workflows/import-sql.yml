name: Import SQL Server
on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**']
permissions:
  contents: read
jobs:
  enova-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: 'Biuro-CI-Only!8349'
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Biuro-CI-Only!8349' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
    env:
      # Ephemeral, synthetic CI database; no connection to any customer installation.
      BIURO_SQLSERVER_TEST_DSN: 'DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;UID=sa;PWD=Biuro-CI-Only!8349;Encrypt=yes;TrustServerCertificate=yes'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install Microsoft ODBC driver
        run: |
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o /tmp/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Install locked import dependencies
        run: python -m pip install --require-hashes -r requirements-enova.lock
      - name: Execute shipped Enova and Platnik SQL as a SELECT-only user
        run: python -m unittest -v tests.sqlserver.test_enova_sql tests.sqlserver.test_platnik_sql
