name: Tests

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**']

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: biuro
          POSTGRES_PASSWORD: biuro
          POSTGRES_DB: biuro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biuro -d biuro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: postgresql://biuro:biuro@localhost:5432/biuro_test
      QT_QPA_PLATFORM: offscreen
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libnss3 libasound2t64 libxcb-cursor0
      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-test.lock
      - name: Create an ephemeral test encryption key
        run: |
          python - <<'PY'
          import os
          from cryptography.fernet import Fernet
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('BIO_ENCRYPTION_KEY=' + Fernet.generate_key().decode() + '\n')
          PY
      - name: Check dependencies and schema migration
        run: |
          python -m pip check
          python migrate_db.py
          python migrate_db.py
      - name: Check Python correctness
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m ruff check app tests
          python -m mypy --follow-imports=skip app/utils/money.py app/reports/dto.py app/utils/table_records.py app/utils/import_source.py app/utils/background.py app/email/notification_types.py
      - name: Check Płatnik forms and filing setup
        run: python -m unittest tests.test_platnik_connection tests.test_platnik_declarations tests.test_monthly_obligations tests.test_checking_refresh tests.test_enova_query_defaults tests.test_enova_checking tests.test_enova_settings_and_jpk tests.test_payment_parser_contractors tests.test_report_import_review_fixes tests.test_civil_owners_authorities tests.test_contract_pack tests.test_power_of_attorney tests.test_email_signature tests.test_monthly_delivery_sorting tests.test_worker_activity tests.test_worker_monitor tests.test_background_worker tests.test_ezla_sync
      - name: Run all test modules
        run: python run_tests.py
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: logs/tests/
          if-no-files-found: ignore

  windows-release:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      QT_OPENGL: software
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Start isolated PostgreSQL
        shell: pwsh
        run: |
          $pgBin = (Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\initdb.exe' | Sort-Object FullName | Select-Object -Last 1).DirectoryName
          if (-not $pgBin) { throw 'PostgreSQL tools missing from runner' }
          & "$pgBin\initdb.exe" -D "$env:RUNNER_TEMP\biuro-pg" -U biuro -A trust --encoding=UTF8 --locale=C
          if ($LASTEXITCODE) { throw 'initdb failed' }
          # Windows runner images can reserve fixed ports (WSAEACCES on 55432).
          # Ask Windows for a bindable ephemeral loopback port instead.
          $probe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          try {
            $probe.Start()
            $pgPort = ([System.Net.IPEndPoint]$probe.LocalEndpoint).Port
          } finally { $probe.Stop() }
          & "$pgBin\pg_ctl.exe" -D "$env:RUNNER_TEMP\biuro-pg" -l "$env:RUNNER_TEMP\biuro-pg.log" -o "-h 127.0.0.1 -p $pgPort" -w start
          if ($LASTEXITCODE) {
            Get-Content "$env:RUNNER_TEMP\biuro-pg.log" -ErrorAction SilentlyContinue
            throw 'Isolated PostgreSQL startup failed'
          }
          & "$pgBin\createdb.exe" -h 127.0.0.1 -p $pgPort -U biuro biuro_release_test
          if ($LASTEXITCODE) { throw 'Isolated test database creation failed' }
          $env:DB_URL = "postgresql://biuro@127.0.0.1:$pgPort/biuro_release_test"
          Add-Content -Path $env:GITHUB_ENV -Value "DB_URL=$env:DB_URL"
      - name: Install locked dependencies and build tools
        run: |
          python -m pip install --require-hashes -r requirements.lock -r requirements-test.lock -r requirements-build.lock
          python -m pip check
          python -c "import os; from cryptography.fernet import Fernet; open(os.environ['GITHUB_ENV'],'a').write('BIO_ENCRYPTION_KEY='+Fernet.generate_key().decode()+'\n')"
      - name: Check existing worker task upgrade without touching Scheduler
        run: python -m unittest tests.test_worker_windows_task
      - name: Check source and build executable
        run: |
          python -m ruff check app tests
          python -m PyInstaller --clean --noconfirm packaging/biuro.spec
      - name: Migrate twice and test packaged executable
        shell: pwsh
        run: |
          function Check-Process($File, $Arguments) {
            $process = Start-Process -FilePath $File -ArgumentList $Arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Process failed: $File ($($process.ExitCode))" }
          }
          Check-Process '.\dist\Biuro\Biuro.exe' '--migrate --non-interactive'
          Check-Process '.\dist\Biuro\Biuro.exe' '--migrate --non-interactive'
          $env:BIO_SMOKE_OUTPUT = "$env:RUNNER_TEMP\packaged-smoke.json"
          Check-Process '.\dist\Biuro\Biuro.exe' '--smoke-test'
          Get-Content $env:BIO_SMOKE_OUTPUT
      - name: Build, install, test and uninstall installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { choco install innosetup --version=6.4.3 -y --no-progress }
          & .\scripts\prepare_odbc_prerequisite.ps1
          & $compiler installer\biuro.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed' }
          $setup = Get-ChildItem installer\output\*.exe | Select-Object -First 1
          $target = "$env:RUNNER_TEMP\Installed Biuro"
          $process = Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -Wait -PassThru
          if ($process.ExitCode) { throw 'Installer failed' }
          if (Test-Path (Join-Path $target 'scripts\install_background_worker.cmd')) { throw 'Worker must not be selected by default' }
          $process = Start-Process "$target\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($process.ExitCode) { throw 'Desktop-only uninstall failed' }
          $process = Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /COMPONENTS=program,worker /DIR=`"$target`"" -Wait -PassThru
          if ($process.ExitCode) { throw 'Combined program/worker installation failed' }
          $workerScript = Join-Path $target 'scripts\install_background_worker.ps1'
          $payrollSql = Join-Path $target '_internal\docs\enova\queries\payroll.sql'
          if (-not (Test-Path $payrollSql)) { throw 'Bundled Enova payroll adapter missing from worker installation' }
          foreach ($adapter in @('declarations', 'jpk')) {
            if (-not (Test-Path (Join-Path $target "_internal\docs\enova\queries\$adapter.sql"))) { throw "Bundled Enova $adapter adapter missing from worker installation" }
          }
          if (-not (Test-Path (Join-Path $target '_internal\docs\platnik\queries\declarations.sql'))) { throw 'Bundled Platnik RCA/DRA adapter missing from worker installation' }
          $workerLauncher = Join-Path $target 'scripts\install_background_worker.cmd'
          if (-not (Test-Path $workerLauncher)) { throw 'Worker launcher missing from installation' }
          $parseTokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($workerScript, [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          $schemaScript = Join-Path $target 'scripts\export_platnik_schema.ps1'
          if (-not (Test-Path $schemaScript)) { throw 'Platnik schema export helper missing' }
          [void][System.Management.Automation.Language.Parser]::ParseFile($schemaScript, [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          $windowsPowerShell = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $windowsPowerShell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $schemaScript -CheckParameters
          if ($LASTEXITCODE) { throw 'Platnik SQL credential construction failed' }
          & $windowsPowerShell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $schemaScript -CheckParameters -CheckWindowsAuthentication
          if ($LASTEXITCODE) { throw 'Platnik Windows credential construction failed' }
          Push-Location $env:RUNNER_TEMP
          try {
            # Exercise the user's real host and default binding, not just pwsh parsing.
            & $windowsPowerShell -NoProfile -NonInteractive -File $workerScript -CheckOnly -NonInteractive
            if ($LASTEXITCODE) { throw 'Worker installer default path validation failed under Windows PowerShell' }
            & $windowsPowerShell -NoProfile -NonInteractive -File $workerScript -ProjectDirectory "$target" -ExecutablePath "$target\Biuro.exe" -CheckOnly -NonInteractive
            if ($LASTEXITCODE) { throw 'Worker launcher path validation failed under Windows PowerShell' }
          } finally { Pop-Location }
          $env:BIO_SMOKE_OUTPUT = "$env:RUNNER_TEMP\installed-smoke.json"
          $env:BIO_SMOKE_REQUIRE_SQL_DRIVER = "1"
          $process = Start-Process "$target\Biuro.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode) { throw 'Installed smoke test failed' }
          Get-Content $env:BIO_SMOKE_OUTPUT
          $process = Start-Process "$target\Biuro.exe" -ArgumentList '--worker --check-config' -Wait -PassThru
          if ($process.ExitCode) { throw 'Packaged worker preflight failed' }
          $process = Start-Process "$target\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($process.ExitCode) { throw 'Uninstall failed' }
      - name: Upload worker installation helpers
        uses: actions/upload-artifact@v6
        with:
          name: worker-installer-windows
          path: |
            scripts/install_background_worker.cmd
            scripts/install_background_worker.ps1
            scripts/WORKER-SETUP.txt
      - name: Collect release diagnostics
        if: always()
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE 'release-diagnostics'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP\*smoke.json", "$env:RUNNER_TEMP\biuro-pg.log" -ErrorAction SilentlyContinue |
            Copy-Item -Destination $destination
          $appLogs = Join-Path $env:LOCALAPPDATA 'Biuro\logs'
          if (Test-Path $appLogs) {
            Copy-Item $appLogs -Destination "$destination\app-logs" -Recurse -Force
            Get-ChildItem "$appLogs\*.log" | ForEach-Object { Get-Content $_.FullName -Tail 100 }
          }
      - name: Retain release diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-diagnostics
          path: release-diagnostics/
          if-no-files-found: ignore
